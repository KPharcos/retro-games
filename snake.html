<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Snake Game</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #222;
            font-family: Arial, sans-serif;
        }
        canvas {
            border: 2px solid #333;
            background-color: #000;
        }
        #game-container {
            position: relative;
            text-align: center;
        }
        #hint {
            color: #aaa;
            font-size: 14px;
            margin-top: 8px;
        }
        #score {
            color: white;
            font-size: 20px;
            margin-bottom: 10px;
        }
        #high-score {
            color: yellow;
            font-size: 16px;
            margin-bottom: 10px;
        }
        #status {
            color: white;
            font-size: 16px;
            min-height: 20px;
            margin-top: 8px;
        }
    </style>
</head>
<body>
    <div id="game-container">
        <div id="score">Score: 0</div>
        <div id="high-score">High Score: 0</div>
        <canvas id="gameCanvas" width="400" height="400" role="img" aria-label="Snake game board"></canvas>
        <div id="status" aria-live="polite"></div>
        <div id="hint">Arrows / WASD move &middot; P: pause &middot; T: wrap-around (<span id="wrap">off</span>)</div>
    </div>

<script>
const GRID = 20, CELL = 20, INITIAL_SPEED = 8, SPEED_STEP = 0.5, SPEED_EVERY = 50; // speed in ticks/sec
const DIRS = { up: [0, -1], down: [0, 1], left: [-1, 0], right: [1, 0] };
const OPPOSITE = { up: 'down', down: 'up', left: 'right', right: 'left' };
const KEY_DIRS = { ArrowUp: 'up', KeyW: 'up', ArrowDown: 'down', KeyS: 'down',
                   ArrowLeft: 'left', KeyA: 'left', ArrowRight: 'right', KeyD: 'right' };

let snake, food, dir, nextDir, score, speed, acc, paused, gameOver, won;
let wrap = false; // survives restart on purpose
let highScore = 0;
try { highScore = Number(localStorage.getItem('snakeHighScore')) || 0; } catch (e) {}

function reset() {
  snake = [{ x: 10, y: 10 }, { x: 9, y: 10 }, { x: 8, y: 10 }]; // head first
  dir = nextDir = 'right';
  score = 0; speed = INITIAL_SPEED; acc = 0;
  paused = gameOver = won = false;
  placeFood();
}

// Picks a random empty cell; returns false when the board is full.
function placeFood() {
  const empty = [];
  for (let x = 0; x < GRID; x++)
    for (let y = 0; y < GRID; y++)
      if (!snake.some(s => s.x === x && s.y === y)) empty.push({ x, y });
  if (!empty.length) return false;
  food = empty[Math.floor(Math.random() * empty.length)];
  return true;
}

function endGame() {
  gameOver = true;
  if (score > highScore) {
    highScore = score;
    try { localStorage.setItem('snakeHighScore', highScore); } catch (e) {}
  }
}

function tick() {
  dir = nextDir;
  const head = { x: snake[0].x + DIRS[dir][0], y: snake[0].y + DIRS[dir][1] };
  if (wrap) { head.x = (head.x + GRID) % GRID; head.y = (head.y + GRID) % GRID; }
  else if (head.x < 0 || head.x >= GRID || head.y < 0 || head.y >= GRID) return endGame();
  const eating = head.x === food.x && head.y === food.y;
  const body = eating ? snake : snake.slice(0, -1); // the tail cell frees up unless we grow this tick
  if (body.some(s => s.x === head.x && s.y === head.y)) return endGame();
  snake.unshift(head);
  if (!eating) { snake.pop(); return; }
  score += 10;
  if (score % SPEED_EVERY === 0) speed += SPEED_STEP;
  if (!placeFood()) { won = true; endGame(); }
}

function step(dt) {
  if (gameOver || paused) return;
  acc += dt;
  while (!gameOver && acc >= 1000 / speed) { acc -= 1000 / speed; tick(); }
}

const GAME_KEYS = ['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Space'];
function onKey(e) {
  if (GAME_KEYS.includes(e.code)) e.preventDefault();
  if (e.repeat && (e.code === 'KeyP' || e.code === 'KeyT')) return; // holding a toggle key must not flicker it
  if (e.code === 'KeyT') { wrap = !wrap; return; }
  if (gameOver) { if (e.code === 'Space') reset(); return; }
  if (e.code === 'KeyP') { paused = !paused; return; }
  const d = KEY_DIRS[e.code];
  if (d && d !== OPPOSITE[dir]) nextDir = d; // checked against the last moved direction, so two quick keys can't reverse
}

// ---- rendering (reads state only) ----
const ctx = document.getElementById('gameCanvas').getContext('2d');
const SIZE = GRID * CELL;

function setText(id, v) { const el = document.getElementById(id); if (el.textContent !== v) el.textContent = v; }

function square(x, y, color) {
  ctx.fillStyle = color;
  ctx.fillRect(x * CELL, y * CELL, CELL, CELL);
  ctx.strokeRect(x * CELL, y * CELL, CELL, CELL);
}

function render() {
  ctx.fillStyle = '#000';
  ctx.fillRect(0, 0, SIZE, SIZE);
  ctx.strokeStyle = '#000';
  snake.forEach((s, i) => square(s.x, s.y, i ? '#00cc00' : '#00ff00'));
  if (!won) square(food.x, food.y, '#ff0000');
  setText('score', 'Score: ' + score);
  setText('high-score', 'High Score: ' + highScore);
  setText('wrap', wrap ? 'on' : 'off');
  const title = won ? 'You win!' : gameOver ? 'Game Over' : paused ? 'Paused' : '';
  setText('status', gameOver ? title + ' Press Space to restart.' : title);
  if (!title) return;
  ctx.fillStyle = 'rgba(0,0,0,0.7)';
  ctx.fillRect(0, 0, SIZE, SIZE);
  ctx.fillStyle = '#fff';
  ctx.textAlign = 'center';
  ctx.font = '24px Arial';
  ctx.fillText(title, SIZE / 2, SIZE / 2 - (gameOver ? 20 : 0));
  if (gameOver) {
    ctx.font = '18px Arial';
    ctx.fillText('Score: ' + score, SIZE / 2, SIZE / 2 + 10);
    ctx.fillText('Press Space to restart', SIZE / 2, SIZE / 2 + 36);
  }
}

let last = null;
function frame(t) {
  if (last !== null) step(Math.min(t - last, 100)); // cap so a backgrounded tab doesn't run a burst of ticks
  last = t;
  render();
  requestAnimationFrame(frame);
}

document.addEventListener('keydown', onKey);
reset();
requestAnimationFrame(frame);
</script>
</body>
</html>
